<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <defs>
    <linearGradient id="pens-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#02389E" />
      <stop offset="50%" stop-color="#035AB1" />
      <stop offset="100%" stop-color="#018FE6" />
    </linearGradient>
    <linearGradient id="pens-bolt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB300" />
      <stop offset="100%" stop-color="#FF6A00" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Rounded App Icon Background -->
  <rect width="32" height="32" rx="8" fill="url(#pens-bg)" />

  <!-- Subtle Inner Border -->
  <rect x="0.5" y="0.5" width="31" height="31" rx="7.5" stroke="rgba(255,255,255,0.2)" fill="none" />

  <!-- Iconic Energy Bolt (PENS Copilot AI & ETHOL Power) -->
  <path
    d="M17.5 4L7 16.5H15.5L14.5 28L25 15.5H16.5L17.5 4Z"
    fill="url(#pens-bolt)"
    filter="url(#shadow)"
  />
</svg>
